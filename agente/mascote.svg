<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="head" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#1b2145"/>
      <stop offset="1" stop-color="#0a0d1c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .float { animation: float 4s ease-in-out infinite; }
    .shadow { animation: shadow 4s ease-in-out infinite; transform-origin: 100px 182px; }
    .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    .orb { animation: pulse 2s ease-in-out infinite; }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    .node.b { animation-delay: 1.2s; }
    @keyframes float { 50% { transform: translateY(-7px); } }
    @keyframes shadow { 50% { transform: scaleX(.8); opacity: .25; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse class="shadow" cx="100" cy="182" rx="46" ry="6" fill="#8b5cf6" opacity=".4"/>

  <g class="float">
    <!-- antena / nó de conexão -->
    <line x1="100" y1="52" x2="100" y2="28" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <circle class="orb" cx="100" cy="22" r="9" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="97" cy="19" r="3" fill="#e6fbff"/>

    <!-- nós laterais (conexões) -->
    <line x1="40" y1="104" x2="22" y2="92" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <circle class="node" cx="18" cy="89" r="6" fill="#8b5cf6" filter="url(#glow)"/>
    <line x1="160" y1="104" x2="178" y2="92" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <circle class="node b" cx="182" cy="89" r="6" fill="#f472b6" filter="url(#glow)"/>

    <!-- cabeça -->
    <rect x="38" y="50" width="124" height="112" rx="46" fill="url(#head)" stroke="url(#g)" stroke-width="4"/>
    <!-- brilho -->
    <path d="M62 68 Q78 58 98 58" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- visor -->
    <rect x="54" y="82" width="92" height="50" rx="25" fill="#04050b" stroke="#22d3ee" stroke-opacity=".35" stroke-width="2"/>

    <!-- olhos -->
    <rect class="eye" x="72" y="96" width="14" height="20" rx="7" fill="#22d3ee" filter="url(#glow)"/>
    <rect class="eye" x="114" y="96" width="14" height="20" rx="7" fill="#22d3ee" filter="url(#glow)"/>

    <!-- bochechas -->
    <ellipse cx="64" cy="140" rx="7" ry="4" fill="#f472b6" opacity=".45"/>
    <ellipse cx="136" cy="140" rx="7" ry="4" fill="#f472b6" opacity=".45"/>

    <!-- sorriso -->
    <path d="M90 142 Q100 150 110 142" stroke="url(#g)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
